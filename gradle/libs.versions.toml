authGoogle = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "authGoogleV" }

google-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "googleMapsV" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

googleService = { id = "com.google.gms.google-services", version.ref = "googleServiceV" }

map-secret = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "mapSecretV" }

